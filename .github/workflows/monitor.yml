name: Congressional Trade Monitor

on:
  schedule:
    # Runs daily at 5:55 AM PST / 6:55 AM PDT (13:55 UTC)
    # Using an odd minute (:55) to beat the top-of-the-hour GitHub traffic jam
    - cron: "55 13 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
    inputs:
      action:
        description: "What to run"
        type: choice
        options:
          - monitor
          - reset
        default: monitor

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Needed to publish the static dashboard to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run should not clobber one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Daily runs and Pages deploys do not count as repository activity, so GitHub
  # would auto-disable this scheduled workflow after 60 idle days. Re-enabling
  # via the API resets that timer without dummy commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow##*/}"
          if [ -z "$workflow" ]; then
            echo "Could not determine workflow file from GITHUB_WORKFLOW_REF" >&2
            exit 1
          fi
          gh api --silent -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          echo "Re-enabled ${workflow} to reset GitHub's 60-day scheduled-workflow inactivity timer."

  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (summary on Sundays, alerts other days)
        env:
          ALERT_EMAIL_SENDER:     ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD:   ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENTS: ${{ secrets.ALERT_EMAIL_RECIPIENTS }}
          GIST_ID:                ${{ secrets.GIST_ID }}
          GIST_TOKEN:             ${{ secrets.GIST_TOKEN }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "reset" ]; then
            echo "Manual reset requested — clearing seen-state Gist"
            python monitor.py --reset-state
            exit 0
          fi
          DAY_PST=$(TZ="America/Los_Angeles" date +%u)
          if [ "$DAY_PST" = "7" ]; then
            echo "It is Sunday in California — running weekly summary"
            python monitor.py --summary --export
          else
            echo "It is Mon-Sat in California — running alert monitor"
            python monitor.py --once --export
          fi

          # Monthly review runs in addition to the daily alerts, not instead of
          # them. It re-reads the logs the daily runs already wrote — no fetching
          # — so it adds seconds, not minutes.
          DOM_PST=$(TZ="America/Los_Angeles" date +%d)
          if [ "$DOM_PST" = "01" ]; then
            echo "First of the month in California — sending monthly review"
            python monitor.py --monthly
          fi

      # The dashboard is rebuilt by --export above from data the run already
      # fetched, so publishing costs a file upload rather than a second scrape.
      - name: Upload dashboard
        if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    # Skipped on reset runs, which exit before building the site.
    if: needs.monitor.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4